name: Release

on:
  # Pushing a tag by hand still works. It is the escape hatch for a release that
  # does not come from a version bump on main.
  push:
    tags:
      - 'v*'
  # Called by tag.yml as soon as the version on main changes. It is a call rather than
  # a tag push because a tag pushed with GITHUB_TOKEN does not start another workflow,
  # so leaning on the tag event would tag quietly and never publish.
  workflow_call:
    inputs:
      version:
        description: The version being released, with no leading v.
        required: true
        type: string

permissions:
  contents: read
  # Needed for npm provenance, which ties the published tarball to this run.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # One path arrives with the version as an input, the other as a tag name.
      - name: Work out which version this is
        id: target
        env:
          GIVEN: ${{ inputs.version }}
        run: |
          if [ -n "$GIVEN" ]; then
            echo "value=$GIVEN" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Publishing the wrong version under the right name is not something npm lets you
      # take back. Stop before that happens.
      - name: Check it matches package.json
        env:
          ASKED: ${{ steps.target.outputs.value }}
        run: |
          declared="$(node -p "require('./package.json').version")"
          if [ "$ASKED" != "$declared" ]; then
            echo "asked for $ASKED but package.json says $declared"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The same check CI runs: install the built package and prove the command works
      # before it goes anywhere near the registry.
      - name: Install it and run it
        run: |
          mkdir -p packed
          npm pack --pack-destination ./packed
          npm install -g ./packed/wordwright-*.tgz
          wordwright --help
          wordwright packs | grep -q beginner

      - name: Publish
        run: npm publish ./packed/wordwright-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
